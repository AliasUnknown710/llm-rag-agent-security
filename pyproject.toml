[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rag-agent-security-lab"
version = "0.1.0"
description = "Enterprise OWASP Top 10 for LLM Applications security evaluation and remediation harness."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportUnknownVariableType = false
reportUnknownMemberType = false